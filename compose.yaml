name: kunaki-preview

services:
  web:
    image: kunaki-preview:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${KUNAKI_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
